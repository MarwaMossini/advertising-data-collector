name: Collect public promotions batch 50
on:
  push:
    branches: [collection/batch-50]
    paths:
      - .github/workflows/collect-public-promotions-batch50.yml
      - batches/collect_batch50.py
      - batches/batch50_profiles.json
permissions: {}
jobs:
  register:
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Link this run from the collection commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending -f context=collection/batch-50 \
            -f description="Collecting public promotional posts" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.0.0
      - run: python batches/collect_batch50.py
      - name: Install video decoder
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Check source files
        run: |
          ffmpeg -version | head -n 1
          for directory in batch50_output/*; do
            python batches/verify_media_batch49.py "$directory/candidates.json" "$directory" \
              || test -s "$directory/manifest.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: promotions-batch50-images-a
          path: batch50_output/0/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: promotions-batch50-images-b
          path: batch50_output/1/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: promotions-batch50-videos
          path: batch50_output/2/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
  report:
    if: always()
    needs: [collect]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Report collection result
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.collect.result }}
        run: |
          if [ "$RESULT" = success ]; then state=success; else state=failure; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context=collection/batch-50 \
            -f description="Public promotional post collection: $RESULT" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
