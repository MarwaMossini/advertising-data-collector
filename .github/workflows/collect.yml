name: Collect curated public ads
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/collect.yml', 'collector.py', 'sources.json', 'tests/**']
permissions:
  contents: read
  actions: read
concurrency:
  group: ad-collector
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          timeout 180s python -m pip install --timeout 30 --retries 1 -r requirements.txt
          python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_version())"
      - name: Restore previous successful dataset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          previous_run=$(gh run list --workflow collect.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$previous_run" ]; then gh run download "$previous_run" --name ad-dataset --dir data; fi
      - name: Test collector
        run: python -m unittest discover -s tests -v
      - name: Collect curated post URLs
        run: python collector.py --limit 50
      - name: Show run summary
        if: always()
        run: |
          if [ -f data/latest_run.json ]; then
            echo '### Collection report' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat data/latest_run.json >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save cumulative dataset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ad-dataset
          path: data/
          retention-days: 90
          compression-level: 0
          if-no-files-found: warn
