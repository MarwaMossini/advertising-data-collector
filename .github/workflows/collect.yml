name: Collect public promotional videos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/collect.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: ad-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Restore previous successful collection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          previous_run=$(gh run list --workflow collect.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$previous_run" ]; then
            gh run download "$previous_run" --name ad-dataset --dir data
          fi
      - name: Test collector rules
        run: python -m unittest discover -s tests -v
      - name: Collect public candidates
        run: python collector.py --limit 10
      - name: Save cumulative collection
        uses: actions/upload-artifact@v4
        with:
          name: ad-dataset
          path: data/
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
