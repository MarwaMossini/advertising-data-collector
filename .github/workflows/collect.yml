name: Collect curated public ads
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/collect.yml', 'collector.py', 'sources.json', 'tests/**']
permissions:
  contents: read
  actions: read
concurrency:
  group: ad-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Restore previous successful dataset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          previous_run=$(gh run list --workflow collect.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$previous_run" ]; then gh run download "$previous_run" --name ad-dataset --dir data; fi
      - name: Test collector
        run: python -m unittest discover -s tests -v
      - name: Collect curated post URLs
        run: python collector.py --limit 25
      - name: Show run summary
        if: always()
        run: |
          if [ -f data/latest_run.json ]; then
            python - <<'PY'
            import json, os
            from pathlib import Path
            r=json.loads(Path('data/latest_run.json').read_text())
            with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write(f"Ads added: {r.get('added_ads',0)}\n\nSnapshots added: {r.get('new_snapshots',0)}\n\nTotal ads: {r.get('total_ads',0)}\n\nTotal snapshots: {r.get('total_snapshots',0)}\n\n")
              for e in r.get('events',[]): f.write(f"- {e.get('status')}: {e.get('url','')} {e.get('error',e.get('reason',''))}\n")
            PY
          fi
      - name: Save cumulative dataset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ad-dataset
          path: data/
          retention-days: 90
          compression-level: 0
          if-no-files-found: warn
