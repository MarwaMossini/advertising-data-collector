name: Recover original records for batch 43
on:
  push:
    branches: [collection/recover-batch-43]
    paths:
      - .github/workflows/recover-public-posts-batch43.yml
      - batches/recover_batch43.py
permissions: {}
jobs:
  register:
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Link this run from the collection commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending -f context=collection/recover-batch-43 \
            -f description="Collecting public promotional posts" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python batches/recover_batch43.py
      - uses: actions/upload-artifact@v4
        with:
          name: batch43-native-metadata
          path: recovered_metadata/
          retention-days: 14
          if-no-files-found: error
  report:
    if: always()
    needs: [collect]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Report collection result
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.collect.result }}
        run: |
          if [ "$RESULT" = success ]; then state=success; else state=failure; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context=collection/recover-batch-43 \
            -f description="Batch 43 original-post recovery: $RESULT" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
