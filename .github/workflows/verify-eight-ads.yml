name: Check eight candidate ads for full media
on:
  push:
    paths: ['.github/workflows/verify-eight-ads.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install downloader
        run: python -m pip install --upgrade yt-dlp
      - name: Validate original links and download full videos
        shell: bash
        run: |
          python - <<'PY'
          import json, re, hashlib, subprocess, shutil, tempfile
          from datetime import datetime, timezone
          from pathlib import Path
          import yt_dlp
          ads=[
            ('_Ra6wkIoJp0','Nike','2024-07-28'),
            ('yP0grL4HZ1E','Nike','2024-08-06'),
            ('uTRwjD10dKY',"McDonald's",'2024-06-25'),
            ('7BprWF9Ip78','Starbucks Coffee','2025-07-09'),
            ('kjVf8ptmDmk','e.l.f. Cosmetics','2024-02-07'),
            ('DXfWY8GpX8Y','e.l.f. Cosmetics','2024-02-07'),
            ('itpcsQQvgAQ','Nintendo of America','2025-01-16'),
            ('hDZ7y8RP5HE','Walt Disney Animation Studios','2024-08-09')
          ]
          folder=Path('verified_media');folder.mkdir(exist_ok=True)
          results=[]
          common={'quiet':True,'no_warnings':True,'noplaylist':True,'socket_timeout':20,
                  'retries':1,'fragment_retries':1,'cachedir':False,'js_runtimes':{'node':{}}}
          for vid,expected_channel,expected_day in ads:
            out={'ad_id':'YT_'+vid,'url':'https://www.youtube.com/watch?v='+vid,
                 'expected_publisher':expected_channel,'expected_date':expected_day,
                 'status':'not_verified'}
            try:
              with yt_dlp.YoutubeDL({**common,'skip_download':True}) as y:
                info=y.extract_info(out['url'],download=False)
              if not info or str(info.get('id',''))!=vid:
                raise ValueError('Wrong video ID / unavailable')
              if info.get('_type') in ('playlist','multi_video') or info.get('entries') or info.get('is_live'):
                raise ValueError('Not a single completed video')
              channel=str(info.get('channel') or info.get('uploader') or '')
              out['publisher']=channel
              if channel.casefold().strip()!=expected_channel.casefold():
                raise ValueError('Publisher mismatch; manual check needed')
              raw_day=str(info.get('upload_date') or '')
              if not re.fullmatch(r'\d{8}',raw_day):
                raise ValueError('Exact date unavailable')
              day=datetime.strptime(raw_day,'%Y%m%d').date().isoformat()
              out['published_date']=day
              if day!=expected_day:
                raise ValueError('Publication date conflict; manual check needed')
              ref_duration=float(info.get('duration') or 0)
              if ref_duration<=0:raise ValueError('No original duration')
              with tempfile.TemporaryDirectory() as td:
                opts={**common,'format':'bv*[ext=mp4]+ba[ext=m4a]/b[ext=mp4]/bv*+ba/b',
                      'merge_output_format':'mp4','outtmpl':td+'/creative.%(ext)s'}
                with yt_dlp.YoutubeDL(opts) as y:y.extract_info(out['url'],download=True)
                files=[p for p in Path(td).glob('creative.*') if p.suffix in ('.mp4','.mkv','.webm')]
                if len(files)!=1:raise ValueError('No single full media file')
                f=files[0]
                if f.stat().st_size<65536:raise ValueError('Media is too small')
                probe=subprocess.run(['ffprobe','-v','error','-show_entries','format=duration:stream=codec_type',
                                      '-of','json',str(f)],capture_output=True,text=True,check=True,timeout=30)
                meta=json.loads(probe.stdout)
                if not any(s.get('codec_type')=='video' for s in meta.get('streams',[])):
                  raise ValueError('Video stream missing')
                duration=float(meta['format']['duration'])
                if abs(duration-ref_duration)>max(4,ref_duration*0.06):
                  raise ValueError('Duration does not match original')
                decoded=subprocess.run(['ffmpeg','-v','error','-xerror','-i',str(f),'-map','0:v:0',
                                        '-f','null','-'],capture_output=True,text=True,timeout=180)
                if decoded.returncode:raise ValueError('Complete media decode failed')
                dst=folder/('YT_'+vid+f.suffix)
                shutil.copyfile(f,dst)
                out.update(status='media_verified',media_file=dst.name,size_bytes=dst.stat().st_size,
                           sha256=hashlib.file_digest(dst.open('rb'),'sha256').hexdigest(),
                           duration_seconds=duration)
            except Exception as e:
              out['reason']=str(e)[:340]
            results.append(out)
            print(json.dumps(out,ensure_ascii=False))
          (folder/'validation_report.json').write_text(json.dumps(results,indent=2),encoding='utf-8')
          PY

      - name: Try public Piped stream endpoints
        shell: bash
        run: |
          python - <<'PY'
          import concurrent.futures, hashlib, json, shutil, subprocess, tempfile
          from pathlib import Path
          from urllib.parse import urlparse
          import requests
          root=Path('verified_media');root.mkdir(exist_ok=True)
          report=root/'validation_report.json'
          rows=json.loads(report.read_text()) if report.exists() else []
          instances=['https://pipedapi.kavin.rocks','https://pipedapi.adminforge.de',
                     'https://pipedapi.tokhmi.xyz','https://piped-api.garudalinux.org',
                     'https://api-piped.mha.fi']
          def process(row):
            if row.get('status')=='media_verified':return row
            vid=row['ad_id'][3:]
            notes=[]
            for base in instances:
              try:
                r=requests.get(base+'/streams/'+vid,timeout=9,headers={'User-Agent':'Mozilla/5.0'})
                if r.status_code!=200:
                  notes.append(base+': HTTP '+str(r.status_code));continue
                m=r.json()
                if m.get('error') or not m.get('videoStreams'):
                  notes.append(base+': no video streams');continue
                publisher=str(m.get('uploader') or '')
                if publisher.casefold().strip()!=row['expected_publisher'].casefold():
                  notes.append(base+': publisher mismatch '+publisher[:70]);continue
                day=str(m.get('uploadDate') or '')[:10]
                if day!=row['expected_date']:
                  notes.append(base+': publication date mismatch '+day);continue
                duration=float(m.get('duration') or 0)
                if duration<=0:notes.append(base+': duration unavailable');continue
                videos=[v for v in m.get('videoStreams',[]) if v.get('url') and not v.get('videoOnly',False)]
                videos=sorted(videos,key=lambda v:int(v.get('bitrate') or 0),reverse=True)
                if not videos:
                  vids=[v for v in m.get('videoStreams',[]) if v.get('url')]
                  auds=[a for a in m.get('audioStreams',[]) if a.get('url')]
                  videos=vids[:1]
                else:
                  auds=[]
                if not videos:
                  notes.append(base+': no downloadable media urls');continue
                def copy_stream(uri,path):
                  parsed=urlparse(uri)
                  if parsed.scheme!='https':raise ValueError('Non-HTTPS stream')
                  total=0
                  with requests.get(uri,stream=True,timeout=(8,20),headers={'User-Agent':'Mozilla/5.0'}) as res:
                    res.raise_for_status()
                    with path.open('wb') as w:
                      for chunk in res.iter_content(262144):
                        if chunk:
                          total+=len(chunk)
                          if total>120*1024*1024:raise ValueError('Stream exceeds limit')
                          w.write(chunk)
                  if total<65536:raise ValueError('Incomplete stream')
                with tempfile.TemporaryDirectory() as td:
                  td=Path(td);vfile=td/'video.bin';outfile=td/'complete.mp4'
                  copy_stream(videos[0]['url'],vfile)
                  if auds:
                    afile=td/'audio.bin';copy_stream(auds[0]['url'],afile)
                    cmd=['ffmpeg','-v','error','-y','-i',str(vfile),'-i',str(afile),'-map','0:v:0','-map','1:a:0','-c','copy',str(outfile)]
                  else:
                    cmd=['ffmpeg','-v','error','-y','-i',str(vfile),'-c','copy',str(outfile)]
                  result=subprocess.run(cmd,capture_output=True,text=True,timeout=90)
                  if result.returncode:raise ValueError('Mux failed: '+result.stderr[-120:])
                  probe=subprocess.run(['ffprobe','-v','error','-show_entries','format=duration:stream=codec_type',
                                        '-of','json',str(outfile)],capture_output=True,text=True,timeout=15,check=True)
                  probed=json.loads(probe.stdout)
                  if not any(s.get('codec_type')=='video' for s in probed.get('streams',[])):
                    raise ValueError('Missing video')
                  actual=float(probed['format']['duration'])
                  if abs(actual-duration)>max(4,.06*duration):raise ValueError('Duration mismatch')
                  full=subprocess.run(['ffmpeg','-v','error','-xerror','-i',str(outfile),'-f','null','-'],
                                      capture_output=True,text=True,timeout=100)
                  if full.returncode:raise ValueError('Failed full decode')
                  dest=root/(row['ad_id']+'.mp4')
                  shutil.copy2(outfile,dest)
                  row.update(status='media_verified',media_file=dest.name,media_size_bytes=dest.stat().st_size,
                             sha256=hashlib.file_digest(dest.open('rb'),'sha256').hexdigest(),
                             published_date=day,publisher=publisher,duration_seconds=actual,
                             capture_method='Piped public stream; full-media decoded; engagement from original search record')
                  notes.append(base+': full-media verified')
                  break
              except Exception as e:
                notes.append(base+': '+str(e)[:130])
            row['alternative_results']=notes
            return row
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
            updated=list(pool.map(process,rows))
          report.write_text(json.dumps(updated,indent=2),encoding='utf-8')
          for r in updated:
            print(json.dumps({'id':r['ad_id'],'status':r['status'],'attempts':r.get('alternative_results',[])}))
          PY
      - name: Display validation results
        if: always()
        run: |
          if [ -f verified_media/validation_report.json ]; then
            echo '### Eight new ad candidates' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat verified_media/validation_report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain complete media and validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eight-ad-media-verification
          path: verified_media/
          retention-days: 7
          compression-level: 0
          if-no-files-found: warn
