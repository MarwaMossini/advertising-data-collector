name: Verify promotional Facebook batch twenty-four 2026-11-05
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-facebook-20261105-batch24.yml'
      - 'batches/public_promotions_20261105_facebook_batch24.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install collector dependencies
        run: timeout 180s python -m pip install --timeout 30 --retries 1 -r requirements.txt
      - name: Run collector tests
        run: python -m unittest discover -s tests -v
      - name: Capture original media and metadata
        run: python collect_paced.py --config batches/public_promotions_20261105_facebook_batch24.json --out facebook_promotions_batch24 --limit 2 --interval-seconds 5
      - name: Save candidate videos and verification metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facebook-promotions-20261105-batch24
          path: facebook_promotions_batch24/
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn
