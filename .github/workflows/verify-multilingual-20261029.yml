name: Verify multilingual promotional videos 2026-10-29
on:
  push:
    paths: ['.github/workflows/verify-multilingual-20261029.yml', 'batches/multilingual_20261029.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install collector dependencies
        run: timeout 180s python -m pip install --timeout 30 --retries 1 -r requirements.txt
      - name: Run collector checks
        run: python -m unittest discover -s tests -v
      - name: Verify publication dates and download original videos
        run: python collector.py --config batches/multilingual_20261029.json --out multilingual_batch --limit 12
      - name: Save verification report and original videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multilingual-promotional-videos-20261029
          path: multilingual_batch/
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn
