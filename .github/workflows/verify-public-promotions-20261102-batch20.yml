name: Verify public promotions batch twenty 2026-11-02
on:
  push:
    paths: ['.github/workflows/verify-public-promotions-20261102-batch20.yml', 'batches/public_promotions_20261102_batch20.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install collector dependencies
        run: timeout 180s python -m pip install --timeout 30 --retries 1 -r requirements.txt
      - name: Run collector checks
        run: python -m unittest discover -s tests -v
      - name: Retrieve publication dates and original full videos
        run: python collect_paced.py --config batches/public_promotions_20261102_batch20.json --out public_promotions_batch20 --limit 30 --interval-seconds 5
      - name: Save candidate media and verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-promotions-20261102-batch20
          path: public_promotions_batch20/
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn
