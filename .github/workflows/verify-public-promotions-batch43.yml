name: Verify public promotions batch 43
on:
  push:
    branches: [collection/batch-43]
    paths:
      - .github/workflows/verify-public-promotions-batch43.yml
      - batches/batch43_sources.json
      - batches/verify_media_batch43.py
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg if needed
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - run: python -m pip install -r requirements.txt Pillow==12.0.0
      - run: python -m unittest discover -s tests -v
      - run: python batches/verify_media_batch43.py batches/batch43_sources.json batch43_output
      - uses: actions/upload-artifact@v4
        with:
          name: promotions-batch43
          path: batch43_output/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
