name: Verify full public videos batch 45
on:
  push:
    branches: [collection/batch-45]
    paths:
      - .github/workflows/verify-public-videos-batch45.yml
      - batches/batch45_video_sources.json
permissions: {}
jobs:
  register:
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Link this run from the collection commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending -f context=collection/batch-45 \
            -f description="Collecting public promotional posts" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install video decoder
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - run: python -m pip install Pillow==12.0.0
      - run: |
          mkdir -p batch45_videos
          cp batches/batch45_video_sources.json batch45_videos/candidates.json
          printf '[]' > batch45_videos/feed_errors.json
          python batches/verify_media_batch45.py batch45_videos/candidates.json batch45_videos \
            || test -s batch45_videos/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: promotions-batch45-verified-videos
          path: batch45_videos/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
  report:
    if: always()
    needs: [collect]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Report collection result
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.collect.result }}
        run: |
          if [ "$RESULT" = success ]; then state=success; else state=failure; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context=collection/batch-45 \
            -f description="Public promotional post collection: $RESULT" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
